<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Face Snap</title>
<style>
  body { font-family: system-ui, sans-serif; background:#151515; color:#eee;
         margin:0; padding:24px; text-align:center; }
  h1 { margin:0 0 18px; font-size:24px; }
  video { width:min(960px, 94vw); display:block; margin:0 auto;
          border-radius:12px; background:#000; }
  .row { display:flex; gap:16px; justify-content:center; align-items:center;
         flex-wrap:wrap; margin-top:18px; }
  button { padding:14px 32px; font-size:18px; cursor:pointer; border:0;
           border-radius:8px; background:#00aaff; color:#fff; }
  button:hover { background:#0088dd; }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin-top:16px; min-height:22px; font-size:15px; }
  #count { margin-top:8px; font-size:14px; color:#999; }
  .ok { color:#4ade80; } .err { color:#f87171; }
  input[type=number] { padding:8px; font-size:16px; width:60px; text-align:center; }
</style>
</head>
<body>
<h1>📸 Face Snap (авто каждые 5 сек)</h1>

<video id="video" autoplay playsinline muted></video>

<div class="row">
  <button id="shot">Сделать кадр [Space]</button>
  <label>
    <input type="checkbox" id="auto" checked> Авто-съёмка
  </label>
  <label>
    Интервал (сек): <input type="number" id="interval" value="5" min="1" max="60">
  </label>
</div>

<div id="status">Запрашиваю камеру…</div>
<div id="count">Кадров: 0</div>

<script>
const $ = id => document.getElementById(id);
const video = $('video');
const statusEl = $('status');
const countEl = $('count');
const shotBtn = $('shot');
const autoChk = $('auto');
const intervalInput = $('interval');

let count = 0;
let busy = false;
let timer = null;

const grab = document.createElement('canvas');

function setStatus(text, cls = '') {
  statusEl.textContent = text;
  statusEl.className = cls;
}

async function snap() {
  if (busy || !video.videoWidth) return;
  busy = true;
  shotBtn.disabled = true;

  try {
    grab.width = video.videoWidth;
    grab.height = video.videoHeight;
    grab.getContext('2d').drawImage(video, 0, 0);
    const b64 = grab.toDataURL('image/jpeg', 0.92);

    const res = await fetch('/snap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: b64 })
    });
    if (!res.ok) throw new Error((await res.text()).slice(0, 200));

    const data = await res.json();
    count++;
    countEl.textContent = `Кадров: ${count}`;
    setStatus('Сохранено: ' + data.file, 'ok');
  } catch (e) {
    setStatus('Ошибка: ' + e.message, 'err');
  } finally {
    busy = false;
    shotBtn.disabled = false;
  }
}

function startAuto() {
  stopAuto();
  const sec = parseInt(intervalInput.value) || 5;
  timer = setInterval(() => {
    if (autoChk.checked) snap();
  }, sec * 1000);
  setStatus(`Авто-съёмка каждые ${sec} сек`, 'ok');
}

function stopAuto() {
  if (timer) {
    clearInterval(timer);
    timer = null;
  }
}

shotBtn.addEventListener('click', snap);
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !['BUTTON', 'INPUT'].includes(document.activeElement?.tagName)) {
    e.preventDefault();
    snap();
  }
});

autoChk.addEventListener('change', () => {
  if (autoChk.checked) startAuto();
  else {
    stopAuto();
    setStatus('Авто-съёмка выключена');
  }
});

intervalInput.addEventListener('change', () => {
  if (autoChk.checked) startAuto();
});

(async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    setStatus('Камера работает. Авто-съёмка запущена.', 'ok');
    startAuto();
  } catch (e) {
    setStatus('Камера недоступна: ' + e.message, 'err');
  }
})();
</script>
</body>
</html>
